packages:
  - 'packages/*'
  - 'apps/*'

# pnpm >=10 blocks lifecycle scripts unless the package is allowlisted here.
# Prisma needs them to place its engines; swc and better-sqlite3 are native modules;
# lefthook downloads the platform binary that runs the git hooks.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  lefthook: true
  prisma: true

# pnpm 12 quarantines very recently published versions by default.
# These are the pins this skeleton was built against.
minimumReleaseAgeExclude:
  - '@nestjs/core@12.0.4'
  - '@nestjs/schematics@12.0.4'
  - '@nestjs/testing@12.0.4'
  - '@typescript-eslint/eslint-plugin@8.70.1'
  - '@typescript-eslint/parser@8.70.1'
  - '@typescript-eslint/project-service@8.70.1'
  - '@typescript-eslint/scope-manager@8.70.1'
  - '@typescript-eslint/tsconfig-utils@8.70.1'
  - '@typescript-eslint/type-utils@8.70.1'
  - '@typescript-eslint/types@8.70.1'
  - '@typescript-eslint/typescript-estree@8.70.1'
  - '@typescript-eslint/utils@8.70.1'
  - '@typescript-eslint/visitor-keys@8.70.1'
  - jsdom@30.1.1
  - typescript-eslint@8.70.1
  - unplugin-swc@2.0.0
  - w3c-xmlserializer@6.0.0
  - dotenv@18.0.2
