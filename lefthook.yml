# Git hooks. Installed by the root `prepare` script, so a fresh clone gets them from
# `pnpm install`.
#
# CI (.github/workflows/ci.yml) is the gate that cannot be skipped and runs everything,
# Playwright included. The hooks only catch the common mistakes early, and each check runs
# once: what can be scoped to the staged files runs per commit, what is whole-project by
# nature runs per push, and Playwright is left to CI. docs/plans/09.
#
# To bypass in a genuine emergency: `LEFTHOOK=0 git commit ...`, or skip a single job with
# `LEFTHOOK_EXCLUDE=gitleaks git commit ...`.

# Seconds-scale, staged files only. Order matters: the data and secret gates run first,
# because a commit that leaks a bank statement is the one failure that is expensive to undo.
pre-commit:
  piped: true # stop at the first failing job
  jobs:
    - name: data-guard
      run: node scripts/check-staged-data.mjs

    - name: gitleaks
      run: ./scripts/gitleaks.sh

    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}

    - name: lint
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint {staged_files}

# Conventional Commits, as the history already writes them. commitlint.config.mjs.
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Whole-project checks, once per push: deps, unused, dupes, types, unit tests with coverage.
# Format and lint already ran per commit; Playwright runs in CI.
pre-push:
  jobs:
    - name: check
      run: node scripts/check.mjs --push
