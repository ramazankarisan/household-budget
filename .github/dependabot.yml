# Weekly dependency updates, grouped so a week is one PR per ecosystem rather than thirty.
# pnpm-workspace.yaml quarantines versions younger than pnpm's minimum release age, so a
# Dependabot PR for a days-old release may need a `minimumReleaseAgeExclude` entry or a
# week's patience. docs/plans/09.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The deliberate pins README.md explains. Moving one is a decision, not a chore.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
